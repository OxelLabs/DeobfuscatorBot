services:
  - type: web
    name: zip-decoder-bot
    runtime: python
    branch: main
    pythonVersion: "3.11.9"
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: MAX_ZIP_MB
        value: "50"
    autoDeploy: true
