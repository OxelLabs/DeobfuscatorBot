services:
  - type: web
    name: zip-deobfuscator-bot
    runtime: docker
    plan: free
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: MAX_ZIP_MB
        value: "50"
      - key: FILE_TIMEOUT_SECONDS
        value: "18"
      - key: TOTAL_JOB_TIMEOUT_SECONDS
        value: "900"
      - key: MAX_CONCURRENT_JOBS
        value: "1"
