services:
  - type: web
    name: zip-deobfuscator-bot
    runtime: docker
    plan: free
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: MAX_ZIP_MB
        value: 50
      - key: MAX_UNCOMPRESSED_MB
        value: 250
      - key: FILE_TIMEOUT_SECONDS
        value: 22
      - key: TOTAL_JOB_TIMEOUT_SECONDS
        value: 1200
      - key: TELEGRAM_UPLOAD_LIMIT_MB
        value: 48
